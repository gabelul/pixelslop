<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelslop Report — {{TITLE}}</title>
  <style>
    /* ── Pixelslop Report — Command Folio variant ──
       Zero radius. No shadows. Tonal stacking. Monospace for data.
       Dense, editorial, technical. Trust through clarity. */

    /* Self-contained — no external font imports. Uses system fonts that
       approximate the Command Folio stack on most platforms. */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Canvas */
      --canvas: #FAFAF8;
      --surface-1: #F4F4F2;
      --surface-2: #EEEEEC;
      --surface-3: #E8E8E6;
      --surface-white: #FFFFFF;

      /* Ink */
      --ink: #111111;
      --ink-secondary: #666666;
      --ink-tertiary: #888888;
      --ink-ghost: #AAAAAA;

      /* Status — data types, not decoration */
      --sage: #4A6741;
      --orange: #C47A2C;
      --red: #8B3A3A;

      /* Borders */
      --border-heavy: #111111;
      --border-light: #E0E0DC;

      /* Fonts — system stacks approximating Space Grotesk / Inter / JetBrains Mono */
      --heading: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
      --body: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
      --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    }

    body {
      font-family: var(--body);
      background: var(--canvas);
      color: var(--ink);
      line-height: 1.55;
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 24px;
      font-size: 13px;
    }

    /* ── Header ── */
    .report-header {
      border-bottom: 2px solid var(--border-heavy);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .report-wordmark {
      font-family: var(--heading);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-tertiary);
      margin-bottom: 8px;
    }
    .report-title {
      font-family: var(--heading);
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .report-meta {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-secondary);
    }
    .report-meta a {
      color: var(--ink-secondary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ── Section headers ── */
    .section-label {
      font-family: var(--heading);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-tertiary);
      border-bottom: 2px solid var(--border-heavy);
      padding-bottom: 8px;
      margin-top: 32px;
      margin-bottom: 16px;
    }

    /* ── KPI Strip ── */
    .kpi-strip {
      display: flex;
      gap: 1px;
      background: var(--border-light);
      margin-bottom: 24px;
    }
    .kpi-block {
      flex: 1;
      background: var(--surface-1);
      padding: 16px;
      border-left: 3px solid var(--ink);
    }
    .kpi-block[data-status="good"] { border-left-color: var(--sage); }
    .kpi-block[data-status="warn"] { border-left-color: var(--orange); }
    .kpi-block[data-status="bad"] { border-left-color: var(--red); }
    .kpi-value {
      font-family: var(--mono);
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }
    .kpi-label {
      font-family: var(--body);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-tertiary);
    }

    /* ── Pillar table ── */
    .pillar-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    .pillar-table thead th {
      font-family: var(--heading);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: left;
      padding: 8px 12px;
      background: var(--ink);
      color: var(--canvas);
    }
    .pillar-table thead th:last-child { text-align: right; }
    .pillar-table tbody tr { border-bottom: 1px solid var(--border-light); }
    .pillar-table tbody tr:nth-child(odd) { background: var(--canvas); }
    .pillar-table tbody tr:nth-child(even) { background: var(--surface-1); }
    .pillar-table td {
      padding: 8px 12px;
      font-size: 13px;
      vertical-align: middle;
    }
    .pillar-table .pillar-name {
      font-family: var(--body);
      font-weight: 500;
      width: 130px;
    }
    .pillar-table .pillar-bar-cell { width: auto; }
    .pillar-table .pillar-score {
      font-family: var(--mono);
      font-weight: 700;
      text-align: right;
      width: 50px;
    }
    .bar-track {
      height: 6px;
      background: var(--border-light);
    }
    .bar-fill {
      height: 100%;
      background: var(--ink);
    }
    .bar-fill[data-level="4"] { background: var(--sage); }
    .bar-fill[data-level="3"] { background: var(--ink); }
    .bar-fill[data-level="2"] { background: var(--orange); }
    .bar-fill[data-level="1"] { background: var(--red); }

    /* ── Slop badge ── */
    .slop-status {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .slop-CLEAN { color: var(--sage); }
    .slop-MILD { color: var(--orange); }
    .slop-SLOPPY { color: var(--orange); }
    .slop-TERMINAL { color: var(--red); }

    /* ── Screenshots ── */
    .screenshot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border-light);
      margin-bottom: 24px;
    }
    .screenshot-card { background: var(--surface-white); overflow: hidden; }
    .screenshot-card img { width: 100%; height: auto; display: block; }
    .screenshot-label {
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-tertiary);
      background: var(--surface-1);
    }
    .screenshot-placeholder {
      padding: 32px 12px;
      text-align: center;
      background: var(--surface-1);
      color: var(--ink-ghost);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Persona cards ── */
    .persona-card {
      background: var(--surface-white);
      border-left: 3px solid var(--ink);
      padding: 16px 20px;
      margin-bottom: 1px;
    }
    .persona-card[data-priority="High"] { border-left-color: var(--red); }
    .persona-card[data-priority="Medium"] { border-left-color: var(--orange); }
    .persona-card[data-priority="Low"] { border-left-color: var(--sage); }
    .persona-name {
      font-family: var(--heading);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .persona-role {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-tertiary);
      margin-bottom: 10px;
    }
    .persona-narrative {
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink-secondary);
      margin-bottom: 12px;
    }
    .persona-meta {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--ink-tertiary);
      border-top: 1px solid var(--border-light);
      padding-top: 8px;
    }
    .persona-meta strong { color: var(--ink); font-weight: 600; }

    /* ── Findings ── */
    .finding-row {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
      align-items: baseline;
    }
    .finding-row:last-child { border-bottom: none; }
    .priority-tag {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .priority-P0 { color: var(--red); }
    .priority-P1 { color: var(--orange); }
    .priority-P2 { color: var(--ink-tertiary); }
    .finding-text { font-size: 13px; line-height: 1.5; }

    /* ── Fix tracking ── */
    .fix-table { width: 100%; border-collapse: collapse; }
    .fix-table thead th {
      font-family: var(--heading);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: left;
      padding: 8px 12px;
      background: var(--ink);
      color: var(--canvas);
    }
    .fix-table tbody tr { border-bottom: 1px solid var(--border-light); }
    .fix-table tbody tr:nth-child(odd) { background: var(--canvas); }
    .fix-table tbody tr:nth-child(even) { background: var(--surface-1); }
    .fix-table td { padding: 8px 12px; font-size: 13px; }
    .fix-table .fix-id { font-family: var(--mono); font-size: 12px; }
    .fix-status {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .fix-PASS { color: var(--sage); }
    .fix-FAIL { color: var(--red); }
    .fix-PARTIAL { color: var(--orange); }
    .fix-OPEN { color: var(--ink-ghost); }

    /* ── Footer ── */
    .report-footer {
      margin-top: 32px;
      padding-top: 12px;
      border-top: 2px solid var(--border-heavy);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-ghost);
    }

    /* ── Dark mode — inverted canvas ── */
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #111111;
        --surface-1: #1a1a1a;
        --surface-2: #222222;
        --surface-3: #2a2a2a;
        --surface-white: #1e1e1e;
        --ink: #E5E5E5;
        --ink-secondary: #AAAAAA;
        --ink-tertiary: #888888;
        --ink-ghost: #555555;
        --sage: #6B9E60;
        --orange: #D4943C;
        --red: #C05555;
        --border-heavy: #E5E5E5;
        --border-light: #2d2d2d;
      }
    }

    /* ── Print ── */
    @media print {
      body { max-width: 100%; padding: 12px; font-size: 11px; }
      .kpi-block, .bar-fill, .priority-tag, .slop-status, .fix-status {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
      }
      .pillar-table thead th { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .fix-table thead th { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <header class="report-header">
    <div class="report-wordmark">Pixelslop</div>
    <h1 class="report-title">{{TITLE}}</h1>
    <div class="report-meta">
      {{URL_META}} · {{DATE}} · confidence {{CONFIDENCE}}%
    </div>
  </header>

  <section id="summary">
    <div class="kpi-strip">
      {{KPI_BLOCKS}}
    </div>

    <table class="pillar-table">
      <thead>
        <tr><th>Pillar</th><th>Score</th><th></th></tr>
      </thead>
      <tbody>
        {{PILLAR_ROWS}}
      </tbody>
    </table>
  </section>

  <section id="screenshots">
    <div class="section-label">Screenshots</div>
    <div class="screenshot-grid">
      {{SCREENSHOT_GRID}}
    </div>
  </section>

  <section id="persona-stories">
    {{PERSONA_SECTIONS}}
  </section>

  <section id="findings">
    <div class="section-label">Findings</div>
    {{FINDINGS_DETAIL}}
  </section>

  <section id="fix-tracking">
    {{FIX_TRACKING}}
  </section>

  <footer class="report-footer">
    Pixelslop · Browser-first design quality review
  </footer>

</body>
</html>
